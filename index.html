<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Росток</title>
<meta name="theme-color" content="#EEF0EB" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#11191C" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Росток">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&family=Onest:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#EEF0EB; --card:#FFFFFF; --ink:#18262B; --mute:#5E6E73; --line:#D8DDD6; --soft:#E3E7E0; --box:#B9C1B8;
  --accent:#D9531E; --accent-ink:#FFFFFF; --done:#2F8F5B; --full:#23744A; --part:#BFE0CC; --part-ink:#18262B;
  --bad:#C23B3B; --hero:#18262B; --hero-ink:#FFFFFF;
  --c-eng:#2F6FDB; --c-rus:#C23B3B; --c-code:#0E8F8A; --c-ai:#7B5CD6; --c-poem:#C2417A; --c-read:#B7791F; --c-music:#5B8C2A; --c-book:#7A5A3A; --c-plan:#5E6E73;
  --f-d:'Oswald','Arial Narrow',sans-serif; --f-b:'Onest',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#11191C; --card:#1A2529; --ink:#E8EDEA; --mute:#97A6AB; --line:#2B3A3F; --soft:#223035; --box:#4A5C61;
    --accent:#FF8A4C; --accent-ink:#1A1208; --done:#3FB273; --full:#2E8F5A; --part:#2C4A3A; --part-ink:#E8EDEA;
    --bad:#FF7B7B; --hero:#24343A; --hero-ink:#F2F5F3;
    --c-eng:#6FA3FF; --c-rus:#FF7B7B; --c-code:#46C9C2; --c-ai:#A890F2; --c-poem:#F07DB0; --c-read:#E9B14F; --c-music:#9BCF5C; --c-book:#C99A6B; --c-plan:#97A6AB;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-b);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
input,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
textarea{resize:vertical;min-height:64px}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,label.btn:focus-within{outline:2px solid var(--accent);outline-offset:2px}
h1,h2{font-family:var(--f-d);font-weight:600;margin:0;text-wrap:balance}
main{max-width:520px;margin:0 auto;
  padding-top:calc(env(safe-area-inset-top,0px) + 20px);
  padding-bottom:calc(env(safe-area-inset-bottom,0px) + 100px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main.full{padding-bottom:calc(env(safe-area-inset-bottom,0px) + 24px)}
.view{display:flex;flex-direction:column;gap:14px}
.eyebrow{font-size:12.5px;color:var(--mute);letter-spacing:.06em;text-transform:uppercase}
.h1{font-size:30px;line-height:1.05;text-transform:uppercase;letter-spacing:.01em}
.h2{font-size:18px;letter-spacing:.01em}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.muted{color:var(--mute);font-size:13.5px;margin:0}
.small{font-size:12.5px;color:var(--mute)}
.title{display:flex;flex-direction:column;gap:4px;min-width:0;flex:1}
.back{border:0;background:none;color:var(--accent);font-size:14px;font-weight:600;padding:6px 0;text-align:left;align-self:flex-start}
.dot{flex:none;width:9px;height:9px;border-radius:2px;display:inline-block}
.row{display:flex;align-items:center;gap:8px}
.spread{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.bar{height:6px;border-radius:3px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%}
.pill{font-size:12px;font-weight:600;border:1px solid currentColor;border-radius:6px;padding:0 7px;white-space:nowrap}
.btn{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:12px 16px;font-size:15px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;color:var(--ink);text-align:center}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;cursor:default}
.btns{display:flex;flex-wrap:wrap;gap:8px}
/* Сегодня */
.brand{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mute)}
.brand b{font-family:var(--f-d);font-weight:600;font-size:17px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink)}
.brand span::before{content:"·";margin-right:8px}
.daynav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.nav{flex:none;width:44px;height:44px;border:1px solid var(--line);background:var(--card);border-radius:10px;display:grid;place-items:center;padding:0}
.nav[disabled]{opacity:.35;cursor:default}
.nav svg{width:20px;height:20px}
.sumcard{display:flex;align-items:center;gap:16px}
.sumcard .big{font-family:var(--f-d);font-size:22px;font-weight:500;line-height:1.2}
.ring{flex:none}
.modes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;background:var(--soft);padding:3px;border-radius:10px}
.modes button{border:0;background:none;border-radius:8px;padding:10px 4px;font-size:13.5px;color:var(--mute)}
.modes button[aria-pressed="true"]{background:var(--card);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.tasks{list-style:none;margin:0;padding:0 16px}
.task{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.task:first-child{border-top:0}
.chk{flex:none;width:30px;height:30px;border:2px solid var(--box);border-radius:8px;background:none;display:grid;place-items:center;padding:0;margin-top:-2px}
.chk svg{width:17px;height:17px;opacity:0}
.task.done .chk{background:var(--done);border-color:var(--done)}
.task.done .chk svg{opacity:1}
.tb{flex:1;min-width:0}
.tt{font-weight:600;display:flex;align-items:center;gap:8px}
.tn{color:var(--mute);font-size:13.5px;margin-top:2px}
.task.done .tt span,.task.done .tn{opacity:.55;text-decoration:line-through}
.go{border:0;background:none;padding:4px 0 0;color:var(--accent);font-size:13px;font-weight:600}
.min{flex:none;font-family:var(--f-d);font-size:16px;color:var(--mute);white-space:nowrap;font-variant-numeric:tabular-nums}
.banner{display:flex;align-items:center;gap:12px;background:var(--hero);color:var(--hero-ink);border-radius:12px;padding:12px 14px}
.banner .tb{font-size:14px}
.banner b{font-family:var(--f-d);font-weight:500;font-size:17px;display:block}
.banner .btn{flex:none;padding:10px 14px}
/* Обучение */
.ccard{display:flex;flex-direction:column;gap:7px;text-align:left;width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.ccard .nm{font-weight:600;flex:1;min-width:0}
.ccard .sub{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;color:var(--mute)}
.ccard .sub span:last-child{text-align:right}
.stages{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}
.stages i{height:6px;border-radius:3px;background:var(--soft)}
.hero{background:var(--hero);color:var(--hero-ink);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px}
.hero .lab{display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:inherit;opacity:.8}
.hero .tl{font-family:var(--f-d);font-size:22px;font-weight:500;line-height:1.2}
.hero .pl{font-size:14px;opacity:.85}
.hero .btn:not(.primary){background:transparent;color:var(--hero-ink);border-color:rgba(255,255,255,.3)}
.lvl{flex:none;width:64px;height:64px;border-radius:12px;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center}
.lvl b{font-family:var(--f-d);font-size:24px;line-height:1}
.lvl span{font-size:11px}
.path{list-style:none;margin:0;padding:0 16px}
.path li{border-top:1px solid var(--line)}
.path li:first-child{border-top:0}
.step{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;padding:10px 0;text-align:left}
.step .tx{flex:1;min-width:0}
.step.cur .tx{font-weight:600}
.step.locked{color:var(--mute)}
.ic{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:600;border:2px solid var(--line)}
.ic.ok{background:var(--done);border-color:var(--done);color:#fff}
.ic.now{border-color:var(--accent);color:var(--accent)}
.ic.ex{border-radius:7px}
.ic.ex.ok{background:var(--done)}
.ic svg{width:15px;height:15px}
.st{font-size:12.5px;color:var(--mute);white-space:nowrap}
.st.now{color:var(--accent);font-weight:600}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tiles.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tile b{font-family:var(--f-d);font-size:26px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums;white-space:nowrap}
.tile span{font-size:12.5px;color:var(--mute)}
.tile.hot b{color:var(--accent)}
.words{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:6px 12px;font-size:14px}
.words .tr{color:var(--mute)}
.counter{display:flex;align-items:center;gap:12px}
.counter .val{font-family:var(--f-d);font-size:40px;font-weight:600;line-height:1;min-width:64px;text-align:center;font-variant-numeric:tabular-nums}
.sq{flex:none;width:48px;height:48px;border-radius:12px;border:1px solid var(--line);background:var(--bg);font-size:22px;font-weight:600;padding:0}
.inl{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--mute);flex-wrap:wrap}
.inl input{width:86px;padding:8px 10px}
.item{display:flex;flex-direction:column;gap:8px;padding:12px 0;border-top:1px solid var(--line)}
.item:first-of-type{border-top:0}
.stg{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}
.stg button{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 2px;font-size:11.5px;color:var(--mute);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stg button.on{background:var(--c-music);border-color:var(--c-music);color:#fff;font-weight:600}
.del{border:0;background:none;color:var(--mute);font-size:13px;padding:4px 0}
.del.warn{color:var(--bad);font-weight:600}
/* Экзамен */
.qbar{display:grid;gap:3px}
.qbar i{height:6px;border-radius:3px;background:var(--line)}
.qbar i.ok{background:var(--done)} .qbar i.no{background:var(--bad)} .qbar i.cur{background:var(--ink)}
.qcard{display:flex;flex-direction:column;gap:8px}
.qtext{font-family:var(--f-d);font-size:24px;font-weight:500;line-height:1.25}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:14px 16px;font-size:16px}
.opt.sel{border:2px solid var(--c-eng);padding:13px 15px;font-weight:600}
.opt.right{border:2px solid var(--done);padding:13px 15px;background:var(--part);color:var(--part-ink);font-weight:600}
.opt.wrong{border:2px solid var(--bad);padding:13px 15px}
.chips{display:flex;flex-wrap:wrap;gap:8px;min-height:48px}
.chips.built{border:1px dashed var(--box);border-radius:12px;padding:8px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 14px;font-size:16px;font-weight:500}
.feedback{border-radius:12px;padding:12px 14px;font-size:14.5px}
.feedback.ok{background:var(--part);color:var(--part-ink)}
.feedback.no{background:var(--card);border:2px solid var(--bad)}
.score{display:flex;align-items:center;gap:16px}
.score .pct{font-family:var(--f-d);font-size:46px;font-weight:600;line-height:1}
.badge{align-self:flex-start;border-radius:6px;padding:2px 10px;font-size:13px;font-weight:600;color:#fff}
.trow{display:grid;grid-template-columns:minmax(0,1fr) 84px 44px;align-items:center;gap:10px;font-size:13.5px;padding:4px 0}
.trow .v{font-family:var(--f-d);font-size:15px;text-align:right;font-variant-numeric:tabular-nums}
.err{display:flex;flex-direction:column;gap:2px;font-size:14px;padding:8px 0;border-top:1px solid var(--line)}
.err:first-of-type{border-top:0}
.err s{color:var(--bad)} .err b{color:var(--done);font-weight:600}
/* Карточки слов */
.flash{min-height:220px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center}
.flash .w{font-family:var(--f-d);font-size:38px;font-weight:600;line-height:1.1}
.flash .t{font-size:18px;color:var(--mute)}
.flash .r{font-size:22px;font-weight:600}
/* Мой рост */
.dows,.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.dows{font-size:11px;color:var(--mute);letter-spacing:.06em;text-transform:uppercase;text-align:center}
.cell{position:relative;height:42px;border:1px solid var(--line);border-radius:9px;background:none;padding:0;font-family:var(--f-d);font-size:16px;font-variant-numeric:tabular-nums}
.cell.full{background:var(--full);border-color:var(--full);color:#fff}
.cell.part{background:var(--part);border-color:var(--part);color:var(--part-ink)}
.cell.today{border:2px solid var(--accent);font-weight:600}
.cell.shift::after{content:"";position:absolute;left:50%;bottom:4px;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:currentColor}
.cell .m{position:absolute;top:2px;left:5px;font-family:var(--f-b);font-size:9px;letter-spacing:.04em;opacity:.75}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--mute);padding-top:10px}
.legend span{display:flex;align-items:center;gap:6px}
.sw{width:12px;height:12px;border-radius:3px;display:inline-block}
.chart svg{display:block;width:100%;height:auto}
.awards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px 8px;text-align:center;font-size:11.5px;line-height:1.25}
.aw{display:flex;flex-direction:column;align-items:center;gap:6px}
.aw .c{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-d);font-size:15px;font-weight:600;color:#fff;background:var(--accent)}
.aw.off{color:var(--mute)}
.aw.off .c{background:none;border:2px dashed var(--box);color:var(--mute)}
.lab{display:flex;flex-direction:column;gap:4px;font-size:13.5px;color:var(--mute)}
.ver{text-align:center;color:var(--mute);font-size:12px}
/* Нижнее меню */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--card);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabbar .in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
.tab{border:0;background:none;height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;color:var(--mute);font-weight:500}
.tab svg{width:26px;height:26px}
.tab[aria-current="page"]{color:var(--accent);font-weight:600}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 80px);z-index:7;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;max-width:calc(100% - 32px)}
.modal{position:fixed;inset:0;z-index:8;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;
  padding:16px max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 16px) max(16px,env(safe-area-inset-left,0px))}
.modal .card{width:100%;max-width:520px;display:flex;flex-direction:column;gap:10px}
.modal textarea{min-height:160px;font-size:13px}
input[type=file]{position:absolute;width:1px;height:1px;opacity:0}
.qtext.sm{font-size:19px}
.opts.row2{flex-direction:row;flex-wrap:wrap}.opts.row2 .opt{flex:1 1 calc(50% - 4px);text-align:center}
.poemtxt{white-space:pre-wrap;font-size:16.5px;line-height:1.6;color:var(--ink);margin:6px 0 12px}
.lnk{color:var(--accent)}
.rule{border-left:3px solid var(--accent);padding-left:12px;font-size:15.5px}
.exm{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px}
.ex{background:var(--soft);border-radius:8px;padding:2px 8px;font-weight:600}
.btn[disabled]{opacity:.6;cursor:default}
@media (prefers-reduced-motion:no-preference){.chk,.cell,.modes button,.opt{transition:background .15s,border-color .15s}}

/* Росток 4.0 — спокойная типографика, ясная иерархия и удобный ритм. */
:root{--bg:#F5F3EE;--card:#FFFEFA;--ink:#252D28;--mute:#6B746D;--line:#DDDCD3;--soft:#E9E9DF;--box:#A1ADA1;--accent:#AC481F;--accent-ink:#fff;--done:#397455;--full:#285C42;--part:#DFEADD;--part-ink:#233D2C;--hero:#253C31;--hero-ink:#F9F8F1;--f-d:'Onest',system-ui,sans-serif;--focus-ring:rgba(172,72,31,.15)}
body{font-size:15px;line-height:1.55;background:var(--bg)}
main{max-width:1120px;padding:32px 24px 120px}
main.full{max-width:800px;margin:0 auto;padding-bottom:80px}
.view{gap:24px}.h1{font-size:clamp(28px,3.6vw,44px);font-weight:600;line-height:1.15;letter-spacing:-.045em;text-transform:none;text-wrap:balance}.h2,h2{font-size:21px;line-height:1.3;letter-spacing:-.025em}h3{font-size:15px;margin:0 0 5px;font-weight:600}.eyebrow{display:block;font-size:10px;letter-spacing:.13em;font-weight:600}.muted{font-size:14px}.small{font-size:12px;line-height:1.6}.page-heading{display:flex;flex-direction:column;gap:9px;padding:12px 0 4px}.page-head{display:flex;align-items:center;justify-content:space-between;gap:12px}.edition{font-size:9px;letter-spacing:.12em;color:var(--mute)}
.brand{gap:10px}.brand b{text-transform:none;font-size:19px;letter-spacing:-.03em;color:var(--ink)}.brand span::before{content:none}.brand .brand-mark{display:grid;place-items:center;width:34px;height:34px;border-radius:11px;background:var(--hero);color:var(--hero-ink);font-size:24px;font-weight:600;letter-spacing:-.1em;padding-right:4px}.brand>span:last-child{font-size:11px}

.update-notice{position:fixed;z-index:9;left:16px;right:16px;top:16px;max-width:500px;margin:auto;background:var(--card);border:1px solid var(--line);box-shadow:0 8px 30px #0002;border-radius:16px;padding:16px;display:flex;align-items:center;gap:16px;font-size:13px}.update-notice .btn{margin-left:auto;flex-shrink:0}

/* Росток 4.2 — оформление по макету: тёмное боковое меню, лес в шапке, зелёный акцент, карточки направлений, графики. */
:root,:root[data-theme=light]{--bg:#F3F6F4;--card:#FFFFFF;--ink:#10201A;--mute:#63746B;--line:#E2E9E4;--soft:#EAF1EC;--box:#A9B8AF;--accent:#16A34A;--accent-ink:#FFFFFF;--done:#16A34A;--full:#15803D;--part:#DCFCE7;--part-ink:#14532D;--hero:#0F2D1F;--hero-ink:#F3FAF5;--bad:#DC2626;--chart-soft:#E3ECE6;--chart-bar:#86D3A4;--focus-ring:rgba(22,163,74,.2);--side:#0B1A12;--side-ink:#A9BDB1;--green:#22C55E;--green-ink:#06210F;color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0A1410;--card:#121E17;--ink:#ECF3EE;--mute:#93A69B;--line:#1F3027;--soft:#182820;--box:#4E6A5A;--accent:#22C55E;--accent-ink:#06210F;--done:#22C55E;--full:#4ADE80;--part:#1B4A31;--part-ink:#D7F5E2;--hero:#0F2D1F;--hero-ink:#F3FAF5;--bad:#F87171;--chart-soft:#1E3127;--chart-bar:#2F9E5F;--focus-ring:rgba(34,197,94,.2);color-scheme:dark}}
:root[data-theme=dark]{--bg:#0A1410;--card:#121E17;--ink:#ECF3EE;--mute:#93A69B;--line:#1F3027;--soft:#182820;--box:#4E6A5A;--accent:#22C55E;--accent-ink:#06210F;--done:#22C55E;--full:#4ADE80;--part:#1B4A31;--part-ink:#D7F5E2;--hero:#0F2D1F;--hero-ink:#F3FAF5;--bad:#F87171;--chart-soft:#1E3127;--chart-bar:#2F9E5F;--focus-ring:rgba(34,197,94,.2);color-scheme:dark}
body{background:var(--bg);color:var(--ink)}
.h1{font-size:28px;font-weight:600;letter-spacing:-.02em;line-height:1.15;text-transform:none}
.h2,h2{font-size:20px;letter-spacing:-.02em}
.card,.ccard,.day-plan,.mode-card,.backup-hint,.tile,.dcard{box-shadow:none;border:1px solid var(--line);background:var(--card);border-radius:18px}
.card{padding:20px}
.btn{border-radius:12px;min-height:46px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600;box-shadow:none}
.btn.block{width:100%;justify-content:center}
.eyebrow{color:var(--mute)}
.icon-btn{width:40px;height:40px;min-height:40px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;padding:0;flex:none}
.icon-btn svg{width:20px;height:20px}
.link{border:0;background:none;color:var(--accent);font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:4px;padding:6px 0;white-space:nowrap}
.link svg{width:16px;height:16px}
.chart-svg{width:100%;height:auto;display:block}
.go,.back{color:var(--accent)}
.pill{background:var(--soft);color:var(--mute);font-size:11px;padding:4px 9px;border-radius:999px;font-weight:500}

/* Верхняя строка: бренд (телефон), заголовок, поиск */
.topbar{position:relative;display:flex;flex-wrap:wrap;align-items:center;gap:12px 14px;min-height:44px}
.topbar-title{flex-basis:100%;order:3}
.topbar .brand{display:flex;align-items:center;gap:9px;font-size:19px;font-weight:700;letter-spacing:.02em;color:var(--ink)}
.topbar .brand-mark{display:grid;place-items:center;width:34px;height:34px;border-radius:11px;background:var(--hero);color:var(--green);font-size:0;padding:0}
.topbar .brand-mark svg{width:20px;height:20px}
.topbar-title{min-width:0;display:flex;flex-direction:column;gap:4px}
.topbar-spacer{flex:1}
.search{position:relative;display:flex;align-items:center;flex:none}
.search input{display:none;border-radius:999px;padding:10px 44px 10px 16px;background:var(--card);border:1px solid var(--line);min-height:42px;width:280px;font-size:14px}
.search .icon-btn{position:relative}
.search-results{position:absolute;top:calc(100% + 6px);right:0;width:min(440px,calc(100vw - 32px));background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 14px 34px rgba(0,0,0,.18);padding:6px;z-index:30;max-height:360px;overflow:auto}
.search-item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:none;padding:10px;border-radius:10px;font-size:14px;color:var(--ink);min-height:44px}
.search-item small{display:block;font-size:11px;color:var(--mute)}
.search-item em{margin-left:auto;font-style:normal;font-size:11px;color:var(--accent);white-space:nowrap}
.search-item:hover{background:var(--soft)}

/* Шапка с лесом */
.hero{position:relative;border-radius:22px;overflow:hidden;color:#fff;padding:24px 20px;background:var(--hero);display:flex;flex-direction:column;gap:18px;min-height:220px}
.hero-art{position:absolute;inset:0;width:100%;height:100%}
.hero-copy{position:relative;z-index:1;max-width:560px;display:flex;flex-direction:column;gap:10px}
.hero-leaf{display:inline-grid;place-items:center;width:34px;height:34px;color:var(--green)}
.hero-leaf svg{width:26px;height:26px}
.hero-title{margin:0;font-size:30px;line-height:1.1;letter-spacing:-.03em;font-weight:700;color:#fff;text-wrap:balance;font-family:var(--f-d)}
.hero-tag{margin:0;font-size:19px;font-weight:600;color:#fff}
.hero-sub,.hero-date{margin:0;font-size:14px;color:rgba(255,255,255,.82)}
.hero .btn.primary{align-self:flex-start;background:var(--green);border-color:var(--green);color:var(--green-ink);box-shadow:0 6px 20px rgba(34,197,94,.35);margin-top:6px}
.hero .btn svg{width:18px;height:18px}
.hero-quote{position:relative;z-index:1;margin:0;max-width:290px;background:rgba(8,26,17,.55);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.14);border-radius:16px;padding:16px 18px;font-size:16px;line-height:1.45;color:#fff}
.hero-quote span{display:block;margin-top:8px;color:var(--green)}
.hero-quote svg{width:18px;height:18px}
.week-strip{position:relative;z-index:1;display:flex;align-items:center;gap:6px;margin-top:auto}
.week-strip .nav{width:30px;height:38px;min-height:38px;border:0;background:transparent;color:rgba(255,255,255,.75);display:grid;place-items:center;padding:0;flex:none;border-radius:10px}
.week-strip .nav svg{width:16px;height:16px}
.week-strip .nav[disabled]{opacity:.3}
.week-strip .days{flex:1;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.wday{display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0 6px;border-radius:12px;border:1px solid rgba(255,255,255,.14);background:rgba(8,26,17,.45);color:rgba(255,255,255,.85);min-height:52px}
.wday span{font-size:10px;letter-spacing:.04em;text-transform:uppercase;opacity:.8}
.wday b{font-size:15px;font-weight:600}
.wday.part b::after,.wday.full b::after{content:'';display:block;width:5px;height:5px;border-radius:50%;background:var(--green);margin:3px auto 0}
.wday.today{border-color:var(--green)}
.wday.sel{background:var(--green);border-color:var(--green);color:var(--green-ink)}
.wday.sel span{opacity:1}
.wday.sel.part b::after,.wday.sel.full b::after{background:var(--green-ink)}

/* Карточки направлений на главной (компьютер) */
.dcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(176px,1fr));gap:12px}
.dcard{display:flex;flex-direction:column;align-items:flex-start;gap:8px;text-align:left;padding:16px;position:relative;min-height:138px;color:var(--ink)}
.dcard:hover{border-color:var(--cc)}
.dcard-ic{display:grid;place-items:center;width:38px;height:38px;border-radius:11px;background:var(--cc);color:#fff}
.dcard-ic svg{width:21px;height:21px}
.dcard b{font-size:15px;line-height:1.3}
.dcard .small{line-height:1.4}
.dcard-arrow{position:absolute;right:14px;bottom:14px;color:var(--mute)}
.dcard-arrow svg{width:16px;height:16px}

/* Панель «Сегодня» */
.today-panel{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px}
.today-panel>.section-head{margin-bottom:10px}
.today-panel .section-head h2{margin:0 0 4px}
.today-cols{display:grid;grid-template-columns:1fr;gap:18px}
.today-list .eyebrow{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.today-chart,.today-overall{border:1px solid var(--line);border-radius:16px;padding:16px;background:var(--bg)}
.today-chart h3,.today-overall h3{margin:0 0 10px;font-size:15px}
.overall-row{display:flex;align-items:center;gap:18px}
.legend-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;font-size:13px;flex:1;min-width:0}
.legend-list li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:8px}
.legend-list li span{flex:1;min-width:0;line-height:1.3}
.legend-list b{font-weight:600}
.delta{background:var(--part);color:var(--part-ink);font-size:12px;font-weight:600;padding:3px 8px;border-radius:999px}
.delta.down{background:#FDE2E2;color:#B42318}
.donut{flex:none}

/* Список дел */
.tasks{list-style:none;margin:0;padding:0}
.task{display:flex;align-items:flex-start;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.task:last-child{border-bottom:0}
.task .chk{width:26px;height:26px;min-height:26px;border-radius:50%;border:2px solid var(--box);background:transparent;display:grid;place-items:center;padding:0;flex:none;margin-top:1px}
.task .chk svg{width:14px;height:14px;opacity:0}
.task.done .chk{background:var(--accent);border-color:var(--accent)}
.task.done .chk svg{opacity:1}
.task .tb{flex:1;min-width:0}
.tt{font-size:15px;line-height:1.4;display:flex;align-items:center;gap:7px;font-weight:500}
.task.done .tt{color:var(--mute);text-decoration:line-through}
.tn{font-size:12.5px;color:var(--mute);margin-top:3px;line-height:1.45}
.min{margin-left:auto;font-size:13px;color:var(--mute);white-space:nowrap;display:flex;align-items:baseline;gap:3px;font-weight:500;font-family:var(--f-b);padding-top:3px}
.min small{font-size:11px;font-weight:400;margin:0}
.tl-min{width:52px;flex:none;font-size:12px;color:var(--mute);padding-top:5px;font-variant-numeric:tabular-nums}
.del-task{width:32px;height:32px;min-height:32px;border:0;background:transparent;color:var(--mute)}
.del-task svg{width:16px;height:16px}
.remaining-tasks{border-top:1px solid var(--line)}
.remaining-tasks summary{padding:12px 0;font-size:13px;font-weight:500;display:flex;align-items:center;gap:10px}
.empty-state{padding:24px 10px}

/* Обучение */
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;font-size:13px;white-space:nowrap;min-height:38px;color:var(--ink);font-weight:500}
.chip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.course-grid{display:grid;grid-template-columns:1fr;gap:14px}
.ccard{display:flex;flex-direction:row;text-align:left;padding:0;overflow:hidden;min-height:0;gap:0;color:var(--ink)}
.ccard:hover{border-color:var(--cc)}
.ccard-art{width:112px;flex:none;background:linear-gradient(160deg,rgba(255,255,255,.22),rgba(0,0,0,.4)),var(--cc);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:14px;color:#fff}
.ccard-ic svg{width:40px;height:40px;opacity:.95}
.ccard-pct{background:rgba(0,0,0,.35);padding:3px 9px;border-radius:999px;font-weight:600;font-size:12px}
.ccard-body{flex:1;min-width:0;padding:14px 16px;display:flex;flex-direction:column;gap:7px}
.ccard-body .nm{font-size:16px;letter-spacing:-.01em;line-height:1.3}
.ccard-body .small{line-height:1.4}
.ccard-body .bar{height:6px}
.ccard-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:auto}
.go-link{color:var(--accent);font-weight:600;font-size:13px;white-space:nowrap}

/* План дня */
.daynav-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px}
.daynav-row .nav{width:40px;height:40px;min-height:40px;border:1px solid var(--line);border-radius:50%;background:var(--bg);display:grid;place-items:center;padding:0;flex:none}
.daynav-row .nav svg{width:18px;height:18px}
.daynav-row .nav[disabled]{opacity:.35}
.daynav-title{display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px;min-width:0}
.daynav-title b{font-size:17px}
.plan-grid{display:grid;grid-template-columns:1fr;gap:16px}
.plan-side{display:flex;flex-direction:column;gap:14px}
.add-task{display:grid;grid-template-columns:1fr 72px;gap:8px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.add-task .btn{grid-column:1/-1}
.add-task input{min-height:44px}
.day-progress{background:var(--soft);border:0}
.quote-card{background:var(--hero);color:var(--hero-ink);display:flex;gap:12px;align-items:flex-start;font-size:15px;line-height:1.5;border:0}
.quote-card span{display:grid;place-items:center;flex:none;color:var(--green)}
.quote-card svg{width:22px;height:22px}

/* Статистика */
.stat-tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tile{padding:16px;display:flex;flex-direction:column;gap:4px;min-height:0;text-align:left}
.tile b{font-size:28px;font-weight:600;letter-spacing:-.03em;line-height:1.1;white-space:normal}
.tile span{font-size:12px;color:var(--mute)}
.stat-grid{display:grid;grid-template-columns:1fr;gap:14px}
.dist-row{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr) 44px}
.dist-row .row{white-space:normal;line-height:1.25;font-size:13px}
.theme-switch{display:flex;gap:4px;background:var(--soft);border-radius:10px;padding:3px}
.theme-switch button{flex:1;border:0;background:transparent;color:var(--ink);font-size:12px;padding:6px 4px;border-radius:8px;min-height:34px;font-weight:500}
.theme-switch button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink)}
.growth-view .week-panel{background:radial-gradient(120% 150% at 88% 0%,#21683F 0%,#0F2D1F 52%,#0A2016 100%)}
.week-switch button[aria-pressed=true]{background:var(--green);border-color:var(--green);color:var(--green-ink)}

/* Урок */
.lesson-grid{display:grid;grid-template-columns:1fr;gap:16px;align-items:start}
.lesson-main{display:flex;flex-direction:column;gap:16px;min-width:0}
.lesson-side{position:sticky;top:24px;display:flex;flex-direction:column;gap:8px}
.lesson-steps{list-style:none;padding:0;margin:8px 0 4px;display:flex;flex-direction:column;gap:2px}
.lesson-steps li{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;font-size:14px;color:var(--mute)}
.lesson-steps li i{width:10px;height:10px;border-radius:50%;border:2px solid var(--box);flex:none}
.lesson-steps li.done{color:var(--ink)}
.lesson-steps li.done i{background:var(--accent);border-color:var(--accent)}
.lesson-steps li.wrong{color:var(--ink)}
.lesson-steps li.wrong i{background:var(--bad);border-color:var(--bad)}
.lesson-steps li.active{background:var(--soft);color:var(--ink);font-weight:600}
.lesson-steps li.skip{opacity:.45}
.exm.code{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.exm.code code{display:block;width:100%;background:#0B1A12;color:#CDEBD6;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;padding:12px 14px;border-radius:10px;white-space:pre-wrap;overflow-wrap:anywhere}

/* Нижнее меню (телефон) */
nav#tabbar{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));top:auto;width:auto;max-width:560px;margin:auto;border:1px solid var(--line);border-radius:20px;background:var(--card);box-shadow:0 8px 28px rgba(10,30,20,.14);padding:0;overflow:hidden;z-index:6}
nav#tabbar::before,nav#tabbar::after{content:none}
nav#tabbar .side-brand,nav#tabbar .side-foot{display:none}
nav#tabbar .in{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;padding:0;max-width:none}
nav#tabbar .tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;height:62px;font-size:10.5px;color:var(--mute);border:0;background:transparent;border-radius:0;padding:0;text-align:center}
nav#tabbar .tab svg{width:22px;height:22px}
nav#tabbar .tab i{font-style:normal}
nav#tabbar .tab .tl-long{display:none}
nav#tabbar .tab[aria-current=page]{background:var(--part);color:var(--full)}
body.app-full nav#tabbar{display:none}
main#app{max-width:600px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 16px) 16px calc(env(safe-area-inset-bottom,0px) + 104px)}
main#app.full{max-width:600px;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 40px)}
.view{gap:16px}
.update-notice{top:calc(12px + env(safe-area-inset-top,0px))}

/* Телефон: поиск по иконке */
@media(max-width:1023px){
  .only-d{display:none!important}
  .search.open{position:absolute;left:0;right:0;top:0;bottom:0;z-index:21;background:var(--bg);display:flex;gap:8px}
  .search.open input{display:block;flex:1;width:auto;padding-right:16px}
  .search.open .search-results{right:0;left:0;width:auto}
}

/* Компьютер: боковое меню слева, широкие сетки */
@media(min-width:1024px){
  .only-m{display:none!important}
  .h1{font-size:32px}
  nav#tabbar{left:0;top:0;bottom:0;right:auto;width:236px;max-width:none;margin:0;border:0;border-radius:0;background:var(--side);color:var(--side-ink);box-shadow:none;display:flex;flex-direction:column;padding:22px 14px}
  body.app-full nav#tabbar{display:flex}
  nav#tabbar .side-brand{display:flex;align-items:center;gap:10px;padding:4px 10px 24px;color:#fff;font-size:20px;font-weight:700;letter-spacing:.03em}
  nav#tabbar .side-brand svg{width:26px;height:26px;color:var(--green)}
  nav#tabbar .in{display:flex;flex-direction:column;gap:4px}
  nav#tabbar .tab{flex-direction:row;justify-content:flex-start;gap:12px;height:46px;padding:0 12px;border-radius:12px;color:var(--side-ink);font-size:14px;font-weight:500;text-align:left}
  nav#tabbar .tab svg{width:20px;height:20px}
  nav#tabbar .tab .tl-long{display:inline}
  nav#tabbar .tab .tl-short{display:none}
  nav#tabbar .tab:hover{background:rgba(255,255,255,.06);color:#fff}
  nav#tabbar .tab[aria-current=page]{background:#163A27;color:#fff}
  nav#tabbar .side-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px;padding:10px}
  nav#tabbar .side-foot .small{color:var(--side-ink)}
  nav#tabbar .theme-switch{background:rgba(255,255,255,.06)}
  nav#tabbar .theme-switch button{color:#DCE8E0}
  nav#tabbar .theme-switch button[aria-pressed=true]{background:var(--green);color:var(--green-ink)}
  nav#tabbar .side-motto{margin-top:10px;line-height:1.5}
  main#app,main#app.full{max-width:none;margin:0 0 0 236px;padding:28px 36px 60px}
  main#app>*{max-width:1180px;margin-left:auto;margin-right:auto}
  main#app.full>*{max-width:1040px}
  .view{gap:22px}
  .topbar{flex-wrap:nowrap}
  .topbar .brand{display:none}
  .topbar-title{flex:1;flex-basis:auto;order:0}
  .search input{display:block}
  .search .icon-btn{position:absolute;right:3px;top:50%;transform:translateY(-50%);width:36px;height:36px;min-height:36px;border:0;background:transparent}
  .hero{padding:40px 40px 32px;min-height:340px;flex-direction:row;flex-wrap:wrap;align-items:flex-start;gap:24px}
  .hero-copy{flex:1;min-width:300px}
  .hero-leaf{width:38px;height:38px}
  .hero-title{font-size:52px;letter-spacing:-.035em}
  .hero-sub{font-size:15px;max-width:420px}
  .hero-quote{font-size:17px;padding:20px 22px;max-width:300px;align-self:flex-start;margin-top:36px}
  .week-strip{flex-basis:100%;max-width:640px}
  .today-cols{grid-template-columns:minmax(0,1.35fr) minmax(0,.95fr) minmax(0,1.1fr);gap:20px;align-items:start}
  .today-panel{padding:26px 28px}
  .course-grid{grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}
  .ccard{flex-direction:column}
  .ccard-art{width:auto;height:126px;flex-direction:row;justify-content:space-between;align-items:center;padding:16px 18px}
  .ccard-ic svg{width:48px;height:48px}
  .ccard-body{padding:16px 18px 18px}
  .plan-grid{grid-template-columns:minmax(0,1.6fr) minmax(280px,1fr);gap:20px;align-items:start}
  .add-task{grid-template-columns:1fr 90px auto}
  .add-task .btn{grid-column:auto}
  .stat-tiles{grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
  .tile b{font-size:32px}
  .stat-grid{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:18px;align-items:start}
  .dist-row{grid-template-columns:170px minmax(0,1fr) 52px}
  .lesson-grid{grid-template-columns:250px minmax(0,1fr);gap:26px}
  .theme-card{display:none}
}
@media(min-width:1024px) and (max-width:1399px){
  .today-cols{grid-template-columns:minmax(0,1.4fr) minmax(0,1fr)}
  .today-list{grid-row:1/3}
  .hero-quote{margin-top:0}
}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) .delta.down{background:#4A1F1F;color:#FCA5A5}}
:root[data-theme=dark] .delta.down{background:#4A1F1F;color:#FCA5A5}
</style>
</head>
<body>
<main id="app" aria-live="polite"></main>
<nav class="tabbar" id="tabbar" aria-label="Разделы">
<div class="side-brand" aria-hidden="true"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M20 3C10 3 4 8 4 15c0 1.6.4 3 1 4 .9-4.3 3.6-7.6 8-9.5-3.2 2.6-5 5.4-5.9 9.1C8.4 19.8 9.7 20 11 20c7 0 9-7 9-17z"/></svg><b>ROSTOK</b></div>
<div class="in">
  <button class="tab" data-tab="today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg><span>Главная</span></button>
  <button class="tab" data-tab="learn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6.5C5.5 5 8.5 5 12 7c3.5-2 6.5-2 9-.5V19c-2.5-1.5-5.5-1.5-9 .5-3.5-2-6.5-2-9-.5z"/><path d="M12 7v12.5"/></svg><span>Обучение</span></button>
  <button class="tab" data-tab="plan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M8 3v4M16 3v4M3.5 10h17M9 15l2 2 4-4"/></svg><span><i class="tl-long">План дня</i><i class="tl-short">План</i></span></button>
  <button class="tab" data-tab="growth"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-8M22 20H2"/></svg><span>Статистика</span></button>
</div>
<div class="side-foot">
  <span class="small">Тема</span>
  <div class="theme-switch" role="group" aria-label="Тема оформления"><button data-theme="">Авто</button><button data-theme="light">Светлая</button><button data-theme="dark">Тёмная</button></div>
  <span class="small side-motto">Шаг за шагом. Каждый день.</span>
</div>
</nav>
<div class="toast" id="toast" hidden></div>
<div class="modal" id="modal" hidden></div>
<script src="plan.js?v=4.2"></script>
<script src="courses.js?v=4.2"></script>
<script src="app.js?v=4.2"></script>
<script>
if ('serviceWorker' in navigator) {
  var hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange', function(){
    if (!hadController) { hadController = true; return; }
    var note = document.createElement('div'); note.className = 'update-notice'; note.setAttribute('role','status');
    note.innerHTML = '<span>Доступна новая версия Ростка</span><button class="btn primary" data-act="reloadapp">Обновить</button>';
    document.body.appendChild(note);
  });
  window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js', {updateViaCache:'none'}).then(function(r){r.update().catch(function(){});}).catch(function(){}); });
}
</script>
</body>
</html>
